<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 人生卡牌应用图标：深色圆角底 + 金色扇形卡牌 + 星芒。
       配色对齐游戏主题（#0a0c10 底 / #d9a84e 金）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6bc66"/>
      <stop offset="1" stop-color="#9c8147"/>
    </linearGradient>
  </defs>

  <!-- 圆角底（苹果会再裁一次圆角，Android/iOS 通用） -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 三张扇形展开的卡牌 -->
  <g>
    <!-- 左牌 -->
    <g transform="translate(256 268) rotate(-16) translate(-104 -140)">
      <rect x="0" y="0" width="208" height="280" rx="22" fill="#141924" stroke="url(#goldEdge)" stroke-width="7"/>
    </g>
    <!-- 右牌 -->
    <g transform="translate(256 268) rotate(16) translate(-104 -140)">
      <rect x="0" y="0" width="208" height="280" rx="22" fill="#141924" stroke="url(#goldEdge)" stroke-width="7"/>
    </g>
    <!-- 中牌（主视觉） -->
    <g transform="translate(152 128)">
      <rect x="0" y="0" width="208" height="280" rx="22" fill="#1b2130" stroke="#d9a84e" stroke-width="8"/>
      <!-- 内框线，模拟卡面纹 -->
      <rect x="20" y="20" width="168" height="240" rx="14" fill="none" stroke="rgba(217,168,78,0.45)" stroke-width="3"/>
    </g>
    <!-- 中牌星芒（命运之星） -->
    <path transform="translate(256 252)" fill="#e6bc66"
          d="M0,-62 L13,-13 L62,0 L13,13 L0,62 L-13,13 L-62,0 L-13,-13 Z"/>
    <circle transform="translate(256 252)" r="11" fill="#f2ede2"/>
    <!-- 星光点缀 -->
    <circle cx="196" cy="176" r="5" fill="#e6bc66" opacity="0.9"/>
    <circle cx="316" cy="336" r="5" fill="#e6bc66" opacity="0.9"/>
    <circle cx="322" cy="170" r="3.5" fill="#e6bc66" opacity="0.7"/>
    <circle cx="190" cy="340" r="3.5" fill="#e6bc66" opacity="0.7"/>
  </g>
</svg>
